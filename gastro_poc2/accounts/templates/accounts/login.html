{% extends "base.html" %}
{% block title %}Login — GastroClinic EMR{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="section-card">
      <h3 class="mb-1">Login</h3>
      <p class="text-muted small">Patients and doctors use the same form.</p>

      {% if form.errors %}
        <div class="alert alert-danger">Invalid ID or password.</div>
      {% endif %}

      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">Patient ID / Username</label>
          <input type="text" name="username" class="form-control" autofocus required>
        </div>
        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-control" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Login</button>
      </form>

      <hr>
      <p class="text-center mb-0">
        New patient? <a href="{% url 'accounts:register' %}">Create an account</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
